[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "modular-diffusion"
version = "0.17.0"
description = "A flow-matching image model assembled from independently trainable units: noise-stage bodies, frequency-band members, content experts and a closed-form spectral anchor"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "AbstractPhil" }]
# Floors only, and no torch pin: installing this package into a hosted notebook must not replace the torch that is there.
# The exact set the tests run on is in requirements.txt.
dependencies = [
  "torch>=2.4",
  "numpy>=1.26",
  "pillow>=10.0",
  "safetensors>=0.4",
]

[project.optional-dependencies]
hub = ["huggingface_hub>=0.30"]
data = ["pyarrow>=15"]
guard = ["psutil>=5.9"]
judge = ["torchmetrics>=1.6", "torch-fidelity>=0.3", "torchvision>=0.19", "scipy>=1.11"]
capture = ["diffusers>=0.30", "transformers>=4.40", "huggingface_hub>=0.30"]
# a picture-and-text chat model writing layouts (experiments.layout_write); the text parser and the trained text-only
# ask come from two packages installed by tag in the notebook, not from here
layout = ["transformers>=5.0", "accelerate>=1.0", "peft>=0.18", "safetensors>=0.4"]
test = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["geolip*"]
namespaces = true

[tool.pytest.ini_options]
testpaths = ["tests"]
